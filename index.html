    let currentFilter = 'all';

    function createInContentAdSlot() {
      const slot = document.createElement('div');
      slot.className = 'in-content-ad-slot';
      const optionsScript = document.createElement('script');
      optionsScript.text = `
        window.atOptions = {
          'key': '54de5027e97a81ba9cd3ec33954b8698',
          'format': 'iframe',
          'height': 250,
          'width': 300,
          'params': {}
        };
      `;
      const invokeScript = document.createElement('script');
      invokeScript.src = 'https://pl31506750.profitableratecpmnetwork.com/00/8f/00/008f0061b7d4bd4a696c0e83c2fb4e2b.js';
      slot.appendChild(optionsScript);
      slot.appendChild(invokeScript);
      return slot;
    }

    function renderGames(list) {
      const grid = document.getElementById('gamesGrid');
      grid.innerHTML = '';
      if (list.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#64748b;">لا توجد ألعاب مطابقة لبحثك، جرب كلمة أخرى.</div>';
        return;
      }
      const AD_SLOT_INTERVAL = 6;
      list.forEach((game, index) => {
        if (index > 0 && index % AD_SLOT_INTERVAL === 0) {
          grid.appendChild(createInContentAdSlot());
        }
        const card = document.createElement('div');
        card.className = 'game-card';
        card.onclick = () => openGameModal(game.id);
        card.innerHTML = `
          <img src="${game.coverImage}" class="card-img" alt="${game.title}">
          <div class="card-body">
            <div>
              <div class="card-title">${game.title}</div>
              <div class="card-genre">${game.genre.join(' • ')}</div>
              <div class="card-desc">${game.description.substring(0, 100)}...</div>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
              <span class="card-rating">★ ${game.rating}</span>
              <span style="font-size:12px; color:var(--neon-purple); font-weight:bold;">التفاصيل ومواصفات التشغيل ←</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterGames(category, element) {
      currentFilter = category;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      if (element) element.classList.add('active');
      const filtered = category === 'all' 
        ? database 
        : database.filter(g => g.category.includes(category));
      renderGames(filtered);
    }

    function normalizeText(text) {
      if (!text) return '';
      return text
        .toLowerCase()
        .replace(/[ً-ٰٟ]/g, '')
        .replace(/[إأآا]/g, 'ا')
        .replace(/ى/g, 'ي')
        .replace(/ة/g, 'ه')
        .replace(/[-_،,.:;!؟?]/g, ' ')
        .trim();
    }

    function performSearch() {
      const rawVal = document.getElementById('searchInput').value.trim();
      const val = normalizeText(rawVal);
      const aiBox = document.getElementById('aiResponseBox');
      const aiContent = document.getElementById('aiContent');
      const aiTips = document.getElementById('aiTips');

      if (!val) {
        aiBox.style.display = 'none';
        filterGames(currentFilter);
        return;
      }

      // Natural language simulation
      aiBox.style.display = 'block';
      if (val.includes('تشبه') || val.includes('ويتشر') || val.includes('witcher')) {
        aiContent.innerText = 'بناءً على طلبك لألعاب تشبه The Witcher 3: رشحنا لك ألعاب القصة العميقة والعوالم المفتوحة مثل Red Dead Redemption 2 و Elden Ring و Cyberpunk 2077.';
        aiTips.innerText = '💡 نصيحة المساعد: استمتع بالقرارات الأخلاقية المتشعبة ونظام السرد السينمائي.';
      } else if (val.includes('ضعيف') || val.includes('خفيف')) {
        aiContent.innerText = 'ترشيحات الأجهزة الضعيفة: ألعاب خفيفة خارقة تعمل بسلاسة فائقة بمعدل 60 إطاراً مثل Hollow Knight و Hades و CS2 و Celeste.';
        aiTips.innerText = '💡 نصيحة المساعد: لا تحتاج لكرت شاشة منفصل، كروت Intel/AMD المدمجة تكفي تماماً.';
      } else if (val.includes('رعب') || val.includes('مخيف')) {
        aiContent.innerText = 'ترشيحات ألعاب الرعب: تحف الرعب النفسي وبقاء الزومبي مثل Resident Evil 4 و Silent Hill 2 و Dead Space و Alan Wake 2.';
        aiTips.innerText = '💡 نصيحة المساعد: استخدم سماعات رأس ثلاثية الأبعاد لأقصى تجربة اندماج ورعب.';
      } else if (val.includes('gta') || val.includes('قراند') || val.includes('متطلبات')) {
        aiContent.innerText = 'متطلبات تشغيل GTA VI وعناوين الجيل الجديد تتطلب معالجاً حديثاً و 16GB RAM كحد أدنى وقرص SSD فائق السرعة.';
        aiTips.innerText = '💡 نصيحة المساعد: كروت الفئة المتوسطة (RTX 2070 / RX 5700) توفر أداءً ممتازاً.';
      } else {
        aiContent.innerText = 'تم فحص استفسارك في قاعدة بيانات manassi.com (' + database.length + ' لعبة) ومطابقة أفضل العناوين ذات الصلة.';
        aiTips.innerText = '💡 نصيحة المساعد: انقر على أي لعبة لاستعراض بطاقتها ومواصفاتها الكاملة.';
      }

      // Smart multi-field search with normalization
      const results = database.filter(g => {
        const titleNorm = normalizeText(g.title);
        const titleEnNorm = normalizeText(g.titleEn);
        const descNorm = normalizeText(g.description);
        const devNorm = normalizeText(g.developer);
        const genreNorm = g.genre.map(normalizeText).join(' ');
        const tagsNorm = g.tags.map(normalizeText).join(' ');

        // Expand common gaming synonyms
        const isGTA = (val.includes('قراند') || val.includes('جراند')) && (titleNorm.includes('سرقه') || titleEnNorm.includes('gta') || titleEnNorm.includes('grand'));
        const isSouls = val.includes('سولز') && (tagsNorm.includes('سولز') || titleNorm.includes('ايلدن') || titleEnNorm.includes('souls') || titleEnNorm.includes('elden'));

        return titleNorm.includes(val) ||
          titleEnNorm.includes(val) ||
          descNorm.includes(val) ||
          devNorm.includes(val) ||
          genreNorm.includes(val) ||
          tagsNorm.includes(val) ||
          isGTA ||
          isSouls;
      });
      renderGames(results);
    }

    function applyPrompt(text) {
      document.getElementById('searchInput').value = text;
      performSearch();
    }

    function randomSuggestion() {
      const randomIdx = Math.floor(Math.random() * database.length);
      openGameModal(database[randomIdx].id);
    }

    function openGameModal(gameId) {
      const game = database.find(g => g.id === gameId);
      if (!game) return;
      document.getElementById('mTitle').innerText = game.title + ' (' + game.titleEn + ')';
      document.getElementById('mDesc').innerText = game.description;
      
      const table = document.getElementById('mSpecsTable');
      table.innerHTML = `
        <tr><th>المكون</th><th>الحد الأدنى</th><th>الموصى به</th></tr>
        <tr><td>نظام التشغيل</td><td>${game.minRequirements.os}</td><td>${game.recRequirements.os}</td></tr>
        <tr><td>المعالج</td><td>${game.minRequirements.cpu}</td><td>${game.recRequirements.cpu}</td></tr>
        <tr><td>كرت الشاشة</td><td>${game.minRequirements.gpu}</td><td>${game.recRequirements.gpu}</td></tr>
        <tr><td>الذاكرة RAM</td><td>${game.minRequirements.ram}</td><td>${game.recRequirements.ram}</td></tr>
        <tr><td>التخزين</td><td>${game.minRequirements.storage}</td><td>${game.recRequirements.storage}</td></tr>
      `;
      document.getElementById('gameModal').style.display = 'flex';
    }

    function closeModal(e) {
      if (e.target.id === 'gameModal') closeModalDirect();
    }
    function closeModalDirect() {
      document.getElementById('gameModal').style.display = 'none';
    }

    // Initial render
    renderGames(database);
  </script>
